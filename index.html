<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f8b">
<title>Checklist Skripsi Edrones</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --fg:#1b1f24; --muted:#667085; --line:#e3e6ea;
  --acc:#1f5f8b; --acc-soft:#e3eef6; --ok:#1e7d4f; --ok-soft:#e2f3ea;
  --warn:#9a5b00; --warn-soft:#fff1d6; --bad:#b42318; --bad-soft:#fde4e2;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111418; --card:#1a1e24; --fg:#e8eaed; --muted:#98a2b3; --line:#2a3038;
    --acc:#6fb1e0; --acc-soft:#1c2c3a; --ok:#5cc98f; --ok-soft:#173226;
    --warn:#f0b54d; --warn-soft:#352812; --bad:#f2786b; --bad-soft:#3a1c19;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  padding:env(safe-area-inset-top) 0 0}
header h1{font-size:16px;margin:0;padding:10px 14px 4px}
header .sub{font-size:12px;color:var(--muted);padding:0 14px 6px}
nav{display:flex;overflow-x:auto;gap:4px;padding:0 10px 8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--fg);
  border-radius:999px;padding:6px 12px;font-size:13px}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
nav button .n{opacity:.75;font-size:11px;margin-left:4px}
main{padding:12px 12px calc(40px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px}
.card h3{font-size:13px;margin:12px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.muted{color:var(--muted);font-size:13px}
.item{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item input[type=checkbox]{width:22px;height:22px;flex:0 0 22px;margin:0;accent-color:var(--ok)}
.item label{flex:1;cursor:pointer}
.item.done label{color:var(--muted);text-decoration:line-through}
.item .del{border:0;background:none;color:var(--muted);font-size:18px;padding:0 4px}
.add{display:flex;gap:6px;margin-top:8px}
.add input{flex:1}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:7px 9px}
textarea{min-height:60px;resize:vertical}
.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:7px 12px;font:inherit;font-size:14px}
.btn.ghost{background:transparent;color:var(--acc)}
.btn.small{padding:4px 9px;font-size:12px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid label{font-size:12px;color:var(--muted);display:block}
.grid .full{grid-column:1/-1}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.prog{margin:8px 0}
.prog .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.note{border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--acc-soft);color:var(--acc)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--acc-soft);padding:1px 4px;border-radius:4px}
pre.cmd{white-space:pre-wrap;word-break:break-all;font:12px ui-monospace,Menlo,monospace;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin:4px 0}
details.fl{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.fl>summary{list-style:none;padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
details.fl>summary::-webkit-details-marker{display:none}
details.fl .body{padding:0 14px 12px}
.code{font-weight:700;min-width:40px}
.tag{font-size:11px;border-radius:99px;padding:2px 8px;background:var(--acc-soft);color:var(--acc);white-space:nowrap}
.st-selesai{background:var(--ok-soft);color:var(--ok)}
.st-ulang{background:var(--warn-soft);color:var(--warn)}
.st-batal{background:var(--bad-soft);color:var(--bad)}
.st-belum{background:var(--line);color:var(--muted)}
.big{font-size:28px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.kpis div{background:var(--bg);border-radius:8px;padding:6px 2px}
.kpis b{display:block;font-size:17px}
.kpis span{font-size:11px;color:var(--muted)}
.spacer{flex:1}
ol.steps{margin:4px 0;padding-left:20px}
ol.steps li{margin:3px 0}
</style>
</head>

// Daftar terbang (urutan selang-seling sesuai bagian G)
const FLIGHTS = (() => {
  const mk = (code, m, fz, pid, r, data=true) => ({code, m, fz, pid, r, data});
  const a = [mk("U1","L1 tetap",0,0,100,false)];
  for (let i=1;i<=5;i++){ a.push(mk("F"+i,"Fuzzy",1,0,100)); a.push(mk("L"+i,"L1 tetap",0,0,100)); }
  a.push(mk("P1","PID",0,1,100));
  for (let i=1;i<=3;i++){ a.push(mk("FK"+i,"Fuzzy",1,0,80)); a.push(mk("LK"+i,"L1 tetap",0,0,80)); }
  return a;
})();

function flightSteps(f){
  const pre = [
    `<code>FUZZY_ENABLE</code> = <b>${f.fz}</b>, <code>NAV_PID_ENABLE</code> = <b>${f.pid}</b>` +
      (f.pid ? ` → cek pesan "NAV: PID ON".` : "."),
    `<code>WP_LOITER_RAD</code> = <b>${f.r}</b>` + (f.r===80 ? " dan misi 8 putaran." : "."),
    `<code>DIST_US</code> = <b>+300</b>.`,
    `CH7 di posisi <b>RENDAH</b>.`,
    `Catat jam, baterai, perkiraan angin (form di bawah).`,
  ];
  const air = f.r===100 ? [
    "Takeoff FBWA, naik ke ketinggian misi.",
    "Masuk <b>AUTO</b> (misi mulai dari WP1).",
    "Leg pesawat → WP1: <b>tanpa gangguan</b>.",
    "Leg U, T, S, B: <b>1 gangguan per leg</b> saat sudah lurus di garis, jangan menjelang WP.",
    "Loiter putaran 1: gangguan di sisi <b>utara</b> dan <b>selatan</b>.",
    "Loiter putaran 2: sisi <b>timur</b> dan <b>barat</b>.",
    "Ubah <code>DIST_US</code> ke <b>−300</b> dari MP.",
    "Putaran 3: sisi U dan S. Putaran 4: sisi T dan B.",
    "Jeda antar gangguan <b>≥ 15 detik</b>.",
    "Pindah ke <b>FBWA</b> (misi di-reset), mendarat.",
  ] : [
    "Takeoff FBWA, masuk AUTO, langsung ke loiter (leg tanpa gangguan).",
    "Putaran 1–4: <code>DIST_US</code> +300, <b>1 gangguan per putaran</b> di sisi U, T, S, B.",
    "Ubah <code>DIST_US</code> ke <b>−300</b>.",
    "Putaran 5–8: sisi U, T, S, B lagi.",
    "Jeda antar gangguan <b>≥ 15 detik</b>.",
    "Pindah ke <b>FBWA</b>, mendarat.",
  ];
  const post = [
    "Kembalikan <code>DIST_US</code> ke +300.",
    "Ganti <code>FUZZY_ENABLE</code> sesuai terbang berikutnya.",
  ];
  if (f.pid) post.push("<code>NAV_PID_ENABLE</code> kembali <b>0</b> (cek pesan \"NAV: L1 (PID OFF)\").");
  post.push("Form catatan terbang terisi, status diubah.");
  return {pre, air, post};
}

function analysisSteps(f){
  const py = `cd ${S.projectDir || DEFAULT_DIR} && python tools/flight_analysis/`;
  const out = "flight_" + (logOf(f.code).tanggal || "YYYY-MM-DD") + "_" + f.code;
  const s = [
    {t:"Log SD disalin ke laptop, nama file dicatat.", cmd:null},
    {t:"Analisis gangguan dari log SD.",
      cmd:`${py}analyze_sdlog_gangguan_kecepatan.py ${logOf(f.code).sd || "LOG.CSV"} -o ${out} --radius ${f.r} --bank 45`},
  ];
  if (f.fz) s.push({t:"Analisis fuzzy.", cmd:`${py}analyze_fuzzy_sdlog.py ${logOf(f.code).sd || "LOG.CSV"}`});
  s.push({t:"Analisis tlog loiter.", cmd:`${py}analyze_tlog_loiter.py ${logOf(f.code).tlog || "FILE.tlog"}`});
  if (f.r===100) s.push({t:"Analisis tlog L1 AUTO (leg).", cmd:`${py}analyze_tlog_l1_auto.py ${logOf(f.code).tlog || "FILE.tlog"}`});
  s.push({t:"Grafik dicek: jumlah gangguan sesuai catatan, tidak ada yang terlewat/ganda.", cmd:null});
  s.push({t:"Metrik dimasukkan ke tabel rekap.", cmd:null});
  return s;
}

const LOG_FIELDS = [
  ["tanggal","Tanggal","date"],["jam","Jam","time"],
  ["tlog","File tlog","text"],["sd","File log SD","text"],
  ["angin","Angin (m/s)","number"],["arah","Angin dari","text"],
  ["batAwal","Baterai awal (V/%)","text"],["batAkhir","Baterai akhir (V/%)","text"],
  ["gPlus","Gangguan + (jumlah)","number"],["gMin","Gangguan − (jumlah)","number"],
];
const STATUS = {belum:"Belum", selesai:"Selesai", ulang:"Perlu diulang", batal:"Batal"};

/* ================= STATE ================= */
function fresh(){ return {checks:{}, flights:{}, days:[], custom:{}, sidang:"", tab:"ringkasan", open:{}, projectDir:DEFAULT_DIR, ts:{}}; }
let S;
try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e){ S = fresh(); }
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); updateHeader(); Sync.schedule(); }

/* Setiap data yang disinkron punya kunci dan waktu ubah (S.ts[kunci]).
   Saat sinkron, untuk tiap kunci dipakai nilai yang paling baru diubah. */
function getV(st, k){
  const [t, a, b] = k.split("\u0001");
  switch (t){
    case "c":  return st.checks[a];
    case "fs": return st.flights[a]?.status;
    case "fl": return st.flights[a]?.log?.[b];
    case "d":  return st.days.find(x=>x.id===a);
    case "cu": return st.custom[a];
    default:   return st[t];   // sidang, projectDir
  }
}
function setV(st, k, v){
  const [t, a, b] = k.split("\u0001");
  const fl = c => (st.flights[c] ||= {status:"belum", log:{}});
  switch (t){
    case "c":  st.checks[a] = v; break;
    case "fs": fl(a).status = v; break;
    case "fl": fl(a).log[b] = v; break;
    case "d": { const i = st.days.findIndex(x=>x.id===a); const c = v && {...v};
      if (i<0) st.days.push(c); else st.days[i] = c;
      st.days.sort((x,y)=>x.date.localeCompare(y.date)); break; }
    case "cu": st.custom[a] = v ? v.map(x=>({...x})) : []; break;
    default:   st[t] = v;
  }
}
const K = (...p) => p.join("\u0001");
function touch(...p){ S.ts[K(...p)] = Date.now(); }
// Semua kunci yang punya nilai (dipakai untuk data lama tanpa ts dan untuk impor)
function allKeys(st){
  const ks = [];
  Object.keys(st.checks).forEach(id=>ks.push(K("c",id)));
  Object.entries(st.flights).forEach(([c,f])=>{ ks.push(K("fs",c)); Object.keys(f.log||{}).forEach(x=>ks.push(K("fl",c,x))); });
  st.days.forEach(d=>ks.push(K("d",d.id)));
  Object.keys(st.custom).forEach(g=>ks.push(K("cu",g)));
  if (st.sidang) ks.push("sidang");
  ks.push("projectDir");
  return ks;
}
function stampAll(st, time){ allKeys(st).forEach(k=>{ if (!st.ts[k]) st.ts[k] = time; }); }
stampAll(S, 1);  // data dari versi sebelum ada sinkron: dianggap paling lama
function mergeInto(local, remote){
  let changed = false;
  Object.entries(remote.ts || {}).forEach(([k,t])=>{
    if (t > (local.ts[k] || 0)){ setV(local, k, getV(remote, k)); local.ts[k] = t; changed = true; }
  });
  return changed;
}
const SYNC_FIELDS = ["checks","flights","days","custom","sidang","projectDir","ts"];
const syncable = st => Object.fromEntries(SYNC_FIELDS.map(f=>[f, st[f]]));

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const logOf = code => (S.flights[code] ||= {status:"belum", log:{}}).log;
const liveDays = () => S.days.filter(d=>!d.deleted);
const flOf = code => (S.flights[code] ||= {status:"belum", log:{}});

/* ================= HITUNG PROGRES ================= */
function groupItemIds(prefix, g){
  const ids = g.items.map((_,i)=>`${prefix}${g.id}:${i}`);
  (S.custom[prefix+g.id] || []).forEach(c => ids.push(`${prefix}${g.id}:c:${c.id}`));
  return ids;
}
function countIds(ids){ return [ids.filter(id=>S.checks[id]).length, ids.length]; }
function progGroups(tab, prefix=""){
  let d=0,t=0; GROUPS[tab].forEach(g=>{ const [a,b]=countIds(groupItemIds(prefix,g)); d+=a; t+=b; }); return [d,t];
}
function progress(){
  const p = {};
  p.persiapan = progGroups("persiapan");
  const dataFlights = FLIGHTS.filter(f=>f.data);
  p.terbang = [dataFlights.filter(f=>flOf(f.code).status==="selesai").length, dataFlights.length];
  let ad=0, at=0;
  dataFlights.forEach(f=>{ analysisSteps(f).forEach((_,i)=>{ at++; if (S.checks[`an:${f.code}:${i}`]) ad++; }); });
  const r = progGroups("analisis"); p.analisis = [ad+r[0], at+r[1]];
  p.skripsi = progGroups("skripsi");
  p.sidang = progGroups("sidang");
  return p;
}

/* ================= RENDER ================= */
const $main = document.getElementById("main");

function updateHeader(){
  const p = progress();
  let d=0,t=0; Object.values(p).forEach(([a,b])=>{d+=a;t+=b;});
  let s = `Total ${Math.round(100*d/Math.max(t,1))}% · terbang ${p.terbang[0]}/${p.terbang[1]}`;
  const dd = daysTo(S.sidang); if (dd!==null) s += ` · sidang ${dd>=0 ? "H-"+dd : "sudah lewat"}`;
  if (typeof Sync !== "undefined" && Sync.on()) s += " · " + Sync.badge();
  document.getElementById("sub").textContent = s;
  document.getElementById("tabs").innerHTML = TABS.map(x => {
    const pr = p[x.id];
    const n = pr ? `<span class="n">${pr[0]}/${pr[1]}</span>` : (x.id==="hari" ? `<span class="n">${liveDays().length}</span>` : "");
    return `<button data-tab="${x.id}" class="${S.tab===x.id?"on":""}">${x.t}${n}</button>`;
  }).join("");
}
function daysTo(dateStr){
  if (!dateStr) return null;
  const t = new Date(dateStr+"T00:00:00"), n = new Date(); n.setHours(0,0,0,0);
  return Math.round((t-n)/86400000);
}

function itemHtml(id, html, removable){
  const on = !!S.checks[id];
  return `<div class="item ${on?"done":""}">
    <input type="checkbox" id="${esc(id)}" data-check="${esc(id)}" ${on?"checked":""}>
    <label for="${esc(id)}">${html}</label>
    ${removable ? `<button class="del" data-delcustom="${esc(removable)}" title="Hapus">×</button>` : ""}
  </div>`;
}
function groupHtml(g, prefix=""){
  const ids = groupItemIds(prefix, g); const [d,t] = countIds(ids);
  let h = `<div class="card"><div class="row"><h2>${g.title}</h2><span class="spacer"></span><span class="muted">${d}/${t}</span></div>`;
  if (g.info) h += `<div class="note info">${g.info}</div>`;
  if (g.params) h += `<table><tr><th>Parameter</th><th>Nilai</th><th>Catatan</th></tr>` +
    PARAMS.map(r=>`<tr><td><code>${r[0]}</code></td><td><b>${r[1]}</b></td><td class="muted">${r[2]}</td></tr>`).join("") + `</table>`;
  g.items.forEach((txt,i)=> h += itemHtml(`${prefix}${g.id}:${i}`, txt));
  (S.custom[prefix+g.id]||[]).forEach(c => h += itemHtml(`${prefix}${g.id}:c:${c.id}`, esc(c.text), `${prefix+g.id}|${c.id}`));
  if (g.editable) h += `<div class="add"><input type="text" placeholder="Tambah item…" data-addinput="${esc(prefix+g.id)}">
    <button class="btn small" data-add="${esc(prefix+g.id)}">Tambah</button></div>`;
  return h + `</div>`;
}
function progHtml(label, [d,t]){
  const pct = Math.round(100*d/Math.max(t,1));
  return `<div class="prog"><div class="t"><span>${label}</span><span class="muted">${d}/${t} · ${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}

        const okF = same.some(x=>x.code[0]==="F"), okL = same.some(x=>x.code[0]==="L");

        <div class="full"><label>Catatan (telemetri putus, keluar loiter, dll.)</label><textarea data-logfield="${f.code}|catatan">${esc(lg.catatan)}</textarea></div>
        <div class="full"><label>Status</label><select data-status="${f.code}">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===st?"selected":""}>${v}</option>`).join("")}</select></div>

    return h;

  analisis(){
    let h = GROUPS.analisis.map(g=>groupHtml(g)).join("");
    const done = FLIGHTS.filter(f => f.data && flOf(f.code).status==="selesai");
    h += `<div class="card"><h2>Per terbang</h2><div class="muted">Muncul setelah status terbang = Selesai. Perintah sudah termasuk <code>cd</code> ke folder project (atur di tab Ringkasan).</div></div>`;
    if (!done.length) h += `<div class="note info">Belum ada terbang yang selesai.</div>`;
    done.forEach(f => {
      const steps = analysisSteps(f);
      const d = steps.filter((_,i)=>S.checks[`an:${f.code}:${i}`]).length;
      h += `<details class="fl" ${S.open["an"+f.code]?"open":""} data-openkey="an${f.code}"><summary><span class="code">${f.code}</span>
        <span>${f.m} · R${f.r}</span><span class="spacer"></span><span class="tag ${d===steps.length?"st-selesai":""}">${d}/${steps.length}</span></summary><div class="body">` +
        steps.map((s,i)=> itemHtml(`an:${f.code}:${i}`, esc(s.t)) +
          (s.cmd ? `<pre class="cmd">${esc(s.cmd)}</pre><button class="btn ghost small" data-copy="${esc(s.cmd)}">Salin perintah</button>` : "")).join("") +
        `</div></details>`;
    });
    return h;
  },
  skripsi(){ return GROUPS.skripsi.map(g=>groupHtml(g)).join(""); },
  sidang(){ return GROUPS.sidang.map(g=>groupHtml(g)).join(""); },
};

function render(){
  updateHeader();
  const y = window.scrollY;
  $main.innerHTML = VIEWS[S.tab]();
  window.scrollTo(0, y);
}

/* ================= EVENTS ================= */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tab],[data-add],[data-delcustom],[data-act],[data-delday],[data-goflight],[data-copy]");
  if (!b) return;
  const d = b.dataset;
  if (d.tab){ S.tab = d.tab; save(); render(); window.scrollTo(0,0); }
  else if (d.add){ addCustom(d.add); }
  else if (d.delcustom){
    const [g,id] = d.delcustom.split("|");
    if (!confirm("Hapus item ini?")) return;
    S.custom[g] = (S.custom[g]||[]).filter(c=>c.id!==id); touch("cu",g); save(); render();
  }
  else if (d.delday){
    if (!confirm("Hapus hari terbang ini beserta checklist-nya?")) return;
    const day = S.days.find(x=>x.id===d.delday);
    if (day){ day.deleted = true; touch("d", day.id); }   // ditandai, bukan dihapus, supaya ikut tersinkron
    save(); render();
  }
  else if (d.goflight){ S.tab="terbang"; S.open[d.goflight]=true; save(); render();
    document.getElementById("fl-"+d.goflight)?.scrollIntoView({behavior:"smooth"}); }
  else if (d.copy){ const old = b.textContent; navigator.clipboard?.writeText(d.copy).then(()=>{ b.textContent="Tersalin ✓"; setTimeout(()=>b.textContent=old,1500); }); }
  else if (d.act) ACTIONS[d.act]();
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (d.check){ S.checks[d.check] = t.checked; touch("c", d.check);
    t.closest(".item")?.classList.toggle("done", t.checked); save(); }
  else if (d.status){ flOf(d.status).status = t.value; touch("fs", d.status); save(); render(); }
  else if (d.sidang !== undefined){ S.sidang = t.value; touch("sidang"); save(); render(); }
});
document.addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if (d.logfield){ const [c,k] = d.logfield.split("|"); logOf(c)[k] = t.value; touch("fl", c, k); save(); }
  else if (d.projectdir !== undefined){ S.projectDir = t.value.trim() || DEFAULT_DIR; touch("projectDir"); save(); }
  else if (d.dayfield){ const [id,k] = d.dayfield.split("|"); const day = S.days.find(x=>x.id===id); if (day){ day[k]=t.value; touch("d", id); save(); } }
});
// Re-render setelah field angin / tanggal selesai diisi (untuk peringatan)
document.addEventListener("focusout", e => {
  const d = e.target.dataset;
  if (pendingRender){ pendingRender = false; setTimeout(safeRender, 0); return; }
  if ((d.logfield && /\|(angin|tanggal)$/.test(d.logfield)) || (d.dayfield && /\|angin$/.test(d.dayfield))) render();
});
document.addEventListener("keydown", e => { if (e.key==="Enter" && e.target.dataset.addinput) addCustom(e.target.dataset.addinput); });
document.addEventListener("toggle", e => {
  const k = e.target.dataset?.openkey; if (!k) return;
  if (e.target.open) S.open[k]=true; else delete S.open[k];
  localStorage.setItem(KEY, JSON.stringify(S));
}, true);

function addCustom(g){
  const inp = document.querySelector(`[data-addinput="${CSS.escape(g)}"]`);
  const text = inp.value.trim(); if (!text) return;
  (S.custom[g] ||= []).push({id:uid(), text}); touch("cu", g); save(); render();
}

function download(name, text, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
const today = () => new Date().toISOString().slice(0,10);
const ACTIONS = {
  export(){ download(`checklist-skripsi-${today()}.json`, JSON.stringify(S,null,2), "application/json"); },
  csv(){
    const cols = ["kode","metode","fuzzy","pid","radius","status",...LOG_FIELDS.map(x=>x[0]),"catatan"];
    const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
    const rows = FLIGHTS.map(f => { const fl = flOf(f.code);
      return [f.code,f.m,f.fz,f.pid,f.r,STATUS[fl.status],...LOG_FIELDS.map(x=>fl.log[x[0]]),fl.log.catatan].map(q).join(","); });
    download(`catatan-terbang-${today()}.csv`, "﻿" + [cols.join(","), ...rows].join("\n"), "text/csv");
  },
  import(){
    const i = document.createElement("input"); i.type="file"; i.accept=".json,application/json";
    i.onchange = () => { const r = new FileReader();
      r.onload = () => { try { const data = JSON.parse(r.result);
          if (typeof data!=="object" || !data.checks) throw new Error("bukan file cadangan");
          if (!confirm("Ganti semua data di HP ini dengan isi file?")) return;
          const keep = {tab:S.tab, open:S.open};
          S = Object.assign(fresh(), data, keep); S.ts = {}; stampAll(S, Date.now()); save(); render();
        } catch(err){ alert("Gagal impor: " + err.message); } };
      r.readAsText(i.files[0]); };
    i.click();
  },
  reset(){
    if (!confirm("Hapus SEMUA centang dan catatan di perangkat ini? Ekspor cadangan dulu kalau ragu." +
      (Sync.on() ? "\n\nData di server tidak dihapus dan akan terambil lagi saat sinkron berikutnya." : ""))) return;
    if (!confirm("Yakin? Tidak bisa dibatalkan.")) return;
    S = fresh(); save(); render();
  },
  async syncon(){
    const token = document.getElementById("syncToken").value.trim();
    const gist = document.getElementById("syncGist").value.trim().replace(/^.*\//, "");
    if (!token){ alert("Tempel token GitHub dulu."); return; }
    await Sync.connect(token, gist); render();
  },
  async syncnow(){ await Sync.now(); render(); },
  syncoff(){
    if (!confirm("Putuskan sinkron di perangkat ini? Data di perangkat dan di gist tetap ada.")) return;
    Sync.disconnect(); render();
  },
  addday(){
    const date = document.getElementById("newDay").value || today();
    const day = {id:uid(), date, angin:"", lokasi:"", catatan:""};
    S.days.push(day); touch("d", day.id);
    S.days.sort((a,b)=>a.date.localeCompare(b.date));
    S.open["d"+day.id] = true;
    save(); render();
  },
};

/* ================= SINKRON GITHUB GIST ================= */
// Token dan ID gist disimpan terpisah dari data (tidak ikut file ekspor, tidak ikut ke gist).
const SYNC_KEY = "edrones-sync-v1";
const GIST_FILE = "checklist-skripsi.json";
const Sync = (() => {
  let cfg = {}; try { cfg = JSON.parse(localStorage.getItem(SYNC_KEY) || "{}"); } catch(e){}
  let timer = null, busy = false, again = false;
  let status = cfg.token ? "Belum sinkron" : "Belum diatur";
  const saveCfg = () => localStorage.setItem(SYNC_KEY, JSON.stringify(cfg));
  const badge = () => !cfg.token ? "" : status.startsWith("Tersinkron") ? "☁︎ ✓" :
    /^(Gagal|Offline)/.test(status) ? "☁︎ !" : "☁︎ …";
  function setStatus(t){
    status = t;
    const el = document.getElementById("syncStatus"); if (el) el.textContent = t;
    updateHeader();
  }
  async function api(path, opt = {}){
    const r = await fetch("https://api.github.com" + path, {...opt, headers:{
      "Accept":"application/vnd.github+json", "Authorization":"Bearer " + cfg.token,
      "X-GitHub-Api-Version":"2022-11-28", ...(opt.body ? {"Content-Type":"application/json"} : {})}});
    if (!r.ok) throw new Error(r.status===401 ? "token salah atau kedaluwarsa" :
      r.status===404 ? "gist tidak ditemukan (cek Gist ID dan izin token)" : "HTTP " + r.status);
    return r.json();
  }
  async function readRemote(){
    const g = await api("/gists/" + cfg.gistId);
    const f = g.files[GIST_FILE];
    if (!f) throw new Error(`file ${GIST_FILE} tidak ada di gist ini`);
    const txt = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
    return JSON.parse(txt).data;
  }
  const files = () => ({[GIST_FILE]: {content: JSON.stringify(
    {app:"checklist-skripsi-edrones", disimpan:new Date().toISOString(), data:syncable(S)})}});
  async function run(){
    if (!cfg.token) return;
    if (busy){ again = true; return; }
    if (!navigator.onLine){ setStatus("Offline: tersimpan di perangkat, sinkron otomatis saat ada internet"); return; }
    busy = true; setStatus("Menyinkron…");
    try {
      if (!cfg.gistId){
        const g = await api("/gists", {method:"POST", body: JSON.stringify(
          {description:"Data Checklist Skripsi Edrones (jangan dihapus)", public:false, files: files()})});
        cfg.gistId = g.id; saveCfg();
      } else {
        const remote = await readRemote();
        const rts = remote.ts || {};
        const needPush = Object.entries(S.ts).some(([k,t]) => t > (rts[k] || 0));
        if (mergeInto(S, remote)){ localStorage.setItem(KEY, JSON.stringify(S)); safeRender(); }
        if (needPush) await api("/gists/" + cfg.gistId, {method:"PATCH", body: JSON.stringify({files: files()})});
      }
      cfg.last = Date.now(); saveCfg();
      setStatus("Tersinkron " + new Date(cfg.last).toLocaleString("id-ID", {dateStyle:"medium", timeStyle:"short"}));
    } catch(e){
      setStatus("Gagal sinkron: " + e.message);
    } finally {
      busy = false;
      if (again){ again = false; run(); }
    }
  }
  return {
    on: () => !!cfg.token, gistId: () => cfg.gistId || "", status: () => status, badge,
    schedule(){ if (!cfg.token) return; clearTimeout(timer); timer = setTimeout(run, 2500);
      if (!busy) setStatus("Ada perubahan, menunggu sinkron…"); },
    now: run,
    connect(token, gistId){ cfg = {token, gistId}; saveCfg(); return run(); },
    disconnect(){ clearTimeout(timer); cfg = {}; saveCfg(); setStatus("Belum diatur"); },
  };
})();
window.addEventListener("online", () => Sync.now());
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") Sync.now(); });

// Jangan render ulang saat sedang mengetik (fokus bisa hilang); tunggu sampai field ditinggalkan.
let pendingRender = false;
function safeRender(){
  const a = document.activeElement;
  if (a && a.matches("input[type=text],input[type=number],input[type=password],textarea")){ pendingRender = true; return; }
  render();
}

render();
Sync.now();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
