<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f8b">
<title>Checklist Skripsi Edrones</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --fg:#1b1f24; --muted:#667085; --line:#e3e6ea;
  --acc:#1f5f8b; --acc-soft:#e3eef6; --ok:#1e7d4f; --ok-soft:#e2f3ea;
  --warn:#9a5b00; --warn-soft:#fff1d6; --bad:#b42318; --bad-soft:#fde4e2;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111418; --card:#1a1e24; --fg:#e8eaed; --muted:#98a2b3; --line:#2a3038;
    --acc:#6fb1e0; --acc-soft:#1c2c3a; --ok:#5cc98f; --ok-soft:#173226;
    --warn:#f0b54d; --warn-soft:#352812; --bad:#f2786b; --bad-soft:#3a1c19;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  padding:env(safe-area-inset-top) 0 0}
header h1{font-size:16px;margin:0;padding:10px 14px 4px}
header .sub{font-size:12px;color:var(--muted);padding:0 14px 6px}
nav{display:flex;overflow-x:auto;gap:4px;padding:0 10px 8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--fg);
  border-radius:999px;padding:6px 12px;font-size:13px}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
nav button .n{opacity:.75;font-size:11px;margin-left:4px}
main{padding:12px 12px calc(40px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px}
.card h3{font-size:13px;margin:12px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.muted{color:var(--muted);font-size:13px}
.item{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item input[type=checkbox]{width:22px;height:22px;flex:0 0 22px;margin:0;accent-color:var(--ok)}
.item label{flex:1;cursor:pointer}
.item.done label{color:var(--muted);text-decoration:line-through}
.item .del{border:0;background:none;color:var(--muted);font-size:18px;padding:0 4px}
.add{display:flex;gap:6px;margin-top:8px;align-items:center}
.add input{flex:1}
.add .btn{flex:0 0 auto;min-height:42px}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=time],select,textarea{
  display:block;width:100%;min-width:0;margin:0;color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:0 10px;
  font-family:inherit;font-size:16px; /* 16px: Safari iPhone tidak zoom saat fokus */
  -webkit-appearance:none;appearance:none}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=time],select{height:42px;line-height:40px}
/* Safari iPhone: isi tanggal/jam rata kiri dan tidak melebar keluar kotak */
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;min-height:40px;line-height:40px}
input[type=date],input[type=time]{text-align:left}
select{padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 18px,calc(100% - 11px) 18px;background-size:5px 5px;background-repeat:no-repeat}
textarea{min-height:70px;padding:8px 10px;line-height:1.4;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:0 14px;min-height:40px;font:inherit;font-size:14px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--acc)}
.btn.small{padding:0 10px;min-height:32px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid>div{min-width:0}
.grid label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.grid .full{grid-column:1/-1}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.prog{margin:8px 0}
.prog .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.note{border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--acc-soft);color:var(--acc)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--acc-soft);padding:1px 4px;border-radius:4px}
pre.cmd{white-space:pre-wrap;word-break:break-all;font:12px ui-monospace,Menlo,monospace;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin:4px 0}
details.fl{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.fl>summary{list-style:none;padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
details.fl>summary::-webkit-details-marker{display:none}
details.fl .body{padding:0 14px 12px}
.code{font-weight:700;min-width:40px}
.tag{font-size:11px;border-radius:99px;padding:2px 8px;background:var(--acc-soft);color:var(--acc);white-space:nowrap}
.st-selesai{background:var(--ok-soft);color:var(--ok)}
.st-ulang{background:var(--warn-soft);color:var(--warn)}
.st-batal{background:var(--bad-soft);color:var(--bad)}
.st-belum{background:var(--line);color:var(--muted)}
.big{font-size:28px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.kpis div{background:var(--bg);border-radius:8px;padding:6px 2px}
.kpis b{display:block;font-size:17px}
.kpis span{font-size:11px;color:var(--muted)}
.spacer{flex:1}
ol.steps{margin:4px 0;padding-left:20px}
ol.steps li{margin:3px 0}
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-h h2{margin:0;flex:1;text-align:center;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.cal .d{min-height:52px;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--bg);font-size:12px;cursor:pointer;overflow:hidden;color:var(--fg);text-align:left}
.cal .d.out{opacity:.4}
.cal .d.today{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.cal .d.sel{background:var(--acc-soft)}
.cal .d .dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
.cal .d .dots i{width:7px;height:7px;border-radius:50%;display:block}
.ev-terbang{background:var(--acc)} .ev-tulis{background:var(--ok)} .ev-tenggat{background:var(--bad)}
.ev-bimbingan{background:var(--warn)} .ev-sidang{background:#8a4fbf} .ev-lain{background:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
</style>
</head>

// Daftar terbang (urutan selang-seling sesuai bagian G)
const FLIGHTS = (() => {
  const mk = (code, m, fz, pid, r, data=true) => ({code, m, fz, pid, r, data});
  const a = [mk("U1","L1 tetap",0,0,100,false)];
  for (let i=1;i<=5;i++){ a.push(mk("F"+i,"Fuzzy",1,0,100)); a.push(mk("L"+i,"L1 tetap",0,0,100)); }
  a.push(mk("P1","PID",0,1,100));
  for (let i=1;i<=3;i++){ a.push(mk("FK"+i,"Fuzzy",1,0,80)); a.push(mk("LK"+i,"L1 tetap",0,0,80)); }
  return a;
})();

/* Setiap data yang disinkron punya kunci dan waktu ubah (S.ts[kunci]).
   Saat sinkron, untuk tiap kunci dipakai nilai yang paling baru diubah. */
function getV(st, k){
  const [t, a, b] = k.split("\u0001");
  switch (t){
    case "c":  return st.checks[a];
    case "fs": return st.flights[a]?.status;
    case "fl": return st.flights[a]?.log?.[b];
    case "d":  return st.days.find(x=>x.id===a);
    case "cu": return st.custom[a];
    case "b":  return (st.bimbingan||[]).find(x=>x.id===a);
    case "ag": return (st.agenda||[]).find(x=>x.id===a);
    case "j":  return (st.jadwal||[]).find(x=>x.id===a);
    default:   return st[t];   // sidang, projectDir
  }
}
function setV(st, k, v){
  const [t, a, b] = k.split("\u0001");
  const fl = c => (st.flights[c] ||= {status:"belum", log:{}});
  switch (t){
    case "c":  st.checks[a] = v; break;
    case "fs": fl(a).status = v; break;
    case "fl": fl(a).log[b] = v; break;
    case "d": { const i = st.days.findIndex(x=>x.id===a); const c = v && {...v};
      if (i<0) st.days.push(c); else st.days[i] = c;
      st.days.sort((x,y)=>x.date.localeCompare(y.date)); break; }
    case "cu": st.custom[a] = v ? v.map(x=>({...x})) : []; break;
    case "b": { const arr = (st.bimbingan ||= []); const i = arr.findIndex(x=>x.id===a); const c = v && JSON.parse(JSON.stringify(v));
      if (i<0) arr.push(c); else arr[i] = c;
      arr.sort((x,y)=>(x.tanggal||"").localeCompare(y.tanggal||"")); break; }
    case "j": { const arr = (st.jadwal ||= []); const i = arr.findIndex(x=>x.id===a); const c = v && {...v};
      if (i<0) arr.push(c); else arr[i] = c; break; }
    case "ag": { const arr = (st.agenda ||= []); const i = arr.findIndex(x=>x.id===a); const c = v && {...v};
      if (i<0) arr.push(c); else arr[i] = c; break; }
    default:   st[t] = v;
  }
}
const K = (...p) => p.join("\u0001");
function touch(...p){ S.ts[K(...p)] = Date.now(); }
// Semua kunci yang punya nilai (dipakai untuk data lama tanpa ts dan untuk impor)
function allKeys(st){
  const ks = [];
  Object.keys(st.checks).forEach(id=>ks.push(K("c",id)));
  Object.entries(st.flights).forEach(([c,f])=>{ ks.push(K("fs",c)); Object.keys(f.log||{}).forEach(x=>ks.push(K("fl",c,x))); });
  st.days.forEach(d=>ks.push(K("d",d.id)));
  Object.keys(st.custom).forEach(g=>ks.push(K("cu",g)));
  (st.bimbingan||[]).forEach(b=>ks.push(K("b",b.id)));
  (st.agenda||[]).forEach(a=>ks.push(K("ag",a.id)));
  (st.jadwal||[]).forEach(j=>ks.push(K("j",j.id)));
  if (st.sidang) ks.push("sidang");
  ks.push("projectDir");
  return ks;
}
function stampAll(st, time){ allKeys(st).forEach(k=>{ if (!st.ts[k]) st.ts[k] = time; }); }

function mergeInto(local, remote){
  let changed = false;
  Object.entries(remote.ts || {}).forEach(([k,t])=>{
    if (t > (local.ts[k] || 0)){ setV(local, k, getV(remote, k)); local.ts[k] = t; changed = true; }
  });
  return changed;
}

/* ================= HITUNG PROGRES ================= */
function groupItemIds(prefix, g){
  const ids = g.items.map((_,i)=>`${prefix}${g.id}:${i}`);
  (S.custom[prefix+g.id] || []).forEach(c => ids.push(`${prefix}${g.id}:c:${c.id}`));
  return ids;
}
function countIds(ids){ return [ids.filter(id=>S.checks[id]).length, ids.length]; }
function progGroups(tab, prefix=""){
  let d=0,t=0; GROUPS[tab].forEach(g=>{ const [a,b]=countIds(groupItemIds(prefix,g)); d+=a; t+=b; }); return [d,t];
}
function progress(){
  const p = {};
  p.persiapan = progGroups("persiapan");
  const dataFlights = FLIGHTS.filter(f=>f.data);
  p.terbang = [dataFlights.filter(f=>flOf(f.code).status==="selesai").length, dataFlights.length];
  let ad=0, at=0;
  dataFlights.forEach(f=>{ analysisSteps(f).forEach((_,i)=>{ at++; if (S.checks[`an:${f.code}:${i}`]) ad++; }); });
  const r = progGroups("analisis"); p.analisis = [ad+r[0], at+r[1]];
  p.skripsi = progGroups("skripsi");
  p.sidang = progGroups("sidang");
  let bd=0, bt=0; liveBim().forEach(b=>b.poin.forEach(x=>{ bt++; if (S.checks[poinCheckId(b,x)]) bd++; }));
  p.bimbingan = [bd, bt];
  return p;
}

/* ---------- File .ics: impor & feed langganan ---------- */
function icsUnesc(v){ return v.replace(/\\n/gi,"\n").replace(/\\([,;\\])/g,"$1"); }
function icsEsc(v){ return String(v).replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1").replace(/\n/g,"\\n"); }
const PREFIX_TYPE = {menulis:"tulis", tulis:"tulis", terbang:"terbang", tenggat:"tenggat", deadline:"tenggat",
  bimbingan:"bimbingan", sidang:"sidang", target:"sidang", lainnya:"lain"};
function parseIcs(text){
  const lines = text.replace(/\r?\n[ \t]/g, "").split(/\r?\n/);   // gabung baris lipatan
  const out = []; let ev = null;
  for (const ln of lines){
    if (ln === "BEGIN:VEVENT") ev = {};
    else if (ln === "END:VEVENT"){ if (ev?.date && ev.summary) out.push(ev); ev = null; }
    else if (ev){
      const i = ln.indexOf(":"); if (i < 0) continue;
      const key = ln.slice(0, i).split(";")[0].toUpperCase(), val = ln.slice(i+1);
      if (key === "UID") ev.uid = val.trim();
      else if (key === "SUMMARY") ev.summary = icsUnesc(val).trim();
      else if (key === "DTSTART"){ const m = val.match(/^(\d{4})(\d{2})(\d{2})/); if (m) ev.date = `${m[1]}-${m[2]}-${m[3]}`; }
    }
  }
  return out.map(e => {
    const m = e.summary.match(/^([A-Za-z ]{2,20}):\s*(.+)$/);
    const type = m && PREFIX_TYPE[m[1].trim().toLowerCase()];
    return {id: (e.uid ? e.uid.split("@")[0] : uid()).replace(/[^\w.-]/g, "_"), date: e.date,
      type: type || "lain", title: type ? m[2] : e.summary, done:false};
  });
}
// Feed untuk Kalender iPhone: semua yang tampil di tab Kalender. Isi deterministik (tanpa jam sekarang)
// supaya gist tidak ditulis ulang kalau tidak ada perubahan.
function buildIcs(){
  const d8 = d => d.replace(/-/g, "");
  const next = d => { const t = new Date(d+"T00:00:00Z"); t.setUTCDate(t.getUTCDate()+1); return t.toISOString().slice(0,10).replace(/-/g,""); };
  const hash = str => { let h = 0; for (const c of str) h = (h*31 + c.codePointAt(0)) >>> 0; return h.toString(36); };
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Checklist Skripsi Edrones//ID","CALSCALE:GREGORIAN",
    "X-WR-CALNAME:Skripsi (aplikasi)","X-WR-TIMEZONE:Asia/Jakarta","REFRESH-INTERVAL;VALUE=DURATION:PT1H","X-PUBLISHED-TTL:PT1H"];
  allEvents().forEach(e => {
    const id = e.jid || e.id || `${e.type}-${e.date}-${hash(e.title)}`;
    const title = `${EV_EMOJI[e.type]||"📌"} ${e.done ? "✅ " : ""}${e.title}`;
    L.push("BEGIN:VEVENT", `UID:${id}@checklist-skripsi-edrones`, "DTSTAMP:20261110T000000Z",
      `DTSTART;VALUE=DATE:${d8(e.date)}`, `DTEND;VALUE=DATE:${next(e.date)}`, `SUMMARY:${icsEsc(title)}`,
      // pengingat: tenggat jam 20.00 sehari sebelumnya, lainnya jam 07.00 di hari itu
      "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(title)}`, e.type==="tenggat" ? "TRIGGER:-PT4H" : "TRIGGER:PT7H","END:VALARM",
      "END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n") + "\r\n";
}

function allEvents(){

  if (S.sidang) ev.push({date:S.sidang, title:"SIDANG SKRIPSI", type:"sidang", tab:"sidang"});

  kalender(){
    const ym = S.calMonth || today().slice(0,7);
    const [Y,M] = ym.split("-").map(Number);
    const first = new Date(Y, M-1, 1), startDow = (first.getDay()+6)%7;   // Senin = 0
    const nDays = new Date(Y, M, 0).getDate();
    const evs = allEvents();
    const sel = S.calSel || today();
    const iso = (y,m,d) => `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    let h = `<div class="card"><div class="cal-h"><button class="btn ghost small" data-calnav="-1">‹</button>
      <h2>${first.toLocaleDateString("id-ID",{month:"long",year:"numeric"})}</h2>
      <button class="btn ghost small" data-calnav="1">›</button>
      <button class="btn ghost small" data-calnav="0">Hari ini</button></div><div class="cal">`;
    ["Sen","Sel","Rab","Kam","Jum","Sab","Min"].forEach(x=> h += `<div class="dow">${x}</div>`);
    for (let i=0;i<startDow;i++) h += `<div></div>`;
    for (let d=1; d<=nDays; d++){
      const ds = iso(Y,M,d), list = evs.filter(e=>e.date===ds);
      const types = [...new Set(list.map(e=>e.type))];
      h += `<button class="d ${ds===today()?"today":""} ${ds===sel?"sel":""}" data-calday="${ds}">${d}
        <div class="dots">${types.map(t=>`<i class="ev-${t}"></i>`).join("")}</div></button>`;
    }
    h += `</div><div class="legend">${Object.entries(EV_TYPES).map(([k,v])=>`<span><i class="ev-${k}"></i>${v}</span>`).join("")}</div></div>`;
    const dl = evs.filter(e=>e.date===sel);
    h += `<div class="card"><h2>${esc(fmtTgl(sel))}</h2>` +
      (dl.length ? dl.map(e=>`<div class="item ${e.done?"done":""}">${e.jid ? `<input type="checkbox" id="jd-${esc(e.jid)}" data-jdone="${esc(e.jid)}" ${e.done?"checked":""}>` : ""}<i class="ev-${e.type}" style="width:10px;height:10px;border-radius:50%;margin-top:6px;flex:0 0 10px"></i>
        <label ${e.jid ? `for="jd-${esc(e.jid)}"` : 'style="cursor:default"'}><b>${EV_TYPES[e.type]}</b> · ${esc(e.title)}${e.tab ? ` <a href="#" class="tag" data-gotab="${e.tab}">buka</a>` : ""}</label>
        ${e.jid ? `<button class="del" data-deljad="${esc(e.jid)}" title="Hapus">×</button>` : e.id ? `<button class="del" data-delag="${e.id}" title="Hapus">×</button>` : ""}</div>`).join("")
        : `<div class="muted">Tidak ada agenda.</div>`) +
      `<div class="add"><select id="agType" style="flex:0 0 120px">${Object.entries(EV_TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
        <input type="text" id="agTitle" placeholder="Agenda baru…">
        <button class="btn small" data-act="addag">Tambah</button></div></div>`;
    const up = evs.filter(e=>!e.done && e.date>=today() && ["tenggat","sidang","terbang"].includes(e.type)).slice(0,6);
    h += `<div class="card"><h2>Tenggat & terbang terdekat</h2>` + (up.length ? up.map(e=>`<div class="item"><i class="ev-${e.type}" style="width:10px;height:10px;border-radius:50%;margin-top:6px;flex:0 0 10px"></i>
      <label style="cursor:default">${esc(fmtTgl(e.date))} <span class="muted">(H-${daysTo(e.date)})</span><br>${esc(e.title)}</label></div>`).join("") : `<div class="muted">Tidak ada.</div>`) + `</div>`;
    {
      const url = Sync.icsUrl();
      h += `<div class="card"><h2>Sambungkan ke Kalender iPhone</h2>`;
      if (!Sync.on()) h += `<div class="note warn">Hubungkan sinkron server dulu (tab Ringkasan). Kalender iPhone membaca jadwal dari gist yang sama.</div>`;
      else if (!url) h += `<div class="note info">Tunggu sinkron pertama selesai, lalu buka tab ini lagi.</div>`;
      else h += `<div class="muted">Semua yang tampil di kalender ini diterbitkan sebagai kalender langganan
          "Skripsi (aplikasi)". Perubahan di aplikasi muncul di Kalender iPhone dalam ±1 jam, lengkap dengan pengingat.</div>
        <div class="row" style="margin:8px 0"><a class="btn" href="${esc(url.replace(/^https:/,"webcal:"))}">Langganan di Kalender</a>
          <button class="btn ghost small" data-copy="${esc(url)}">Salin URL</button></div>
        <pre class="cmd">${esc(url)}</pre>

          Google Calendar juga bisa: Setelan → Tambahkan kalender → Dari URL. URL ini rahasia; siapa pun yang punya URL-nya bisa melihat jadwal.</div>`;

  terbang(){
    let h = `<div class="card"><h2>Daftar terbang</h2><div class="muted">Urutan selang-seling F → L supaya angin tidak tercampur ke hasil.
      P1 setelah F dan L berhasil di hari yang sama. R80 hanya angin ≤ 4 m/s.</div></div>`;

      const warns = [];
      if (f.r===80 && Number(lg.angin) > 4) warns.push(`<div class="note bad">Angin ${esc(lg.angin)} m/s > 4: tunda grup R80.</div>`);
      if (f.pid) {
        const same = FLIGHTS.filter(x => x.code!=="P1" && /^[FL]\d$/.test(x.code) && flOf(x.code).status==="selesai" && lg.tanggal && logOf(x.code).tanggal===lg.tanggal);
        const okF = same.some(x=>x.code[0]==="F"), okL = same.some(x=>x.code[0]==="L");
        if (!(okF && okL)) warns.push(`<div class="note warn">P1 sebaiknya setelah minimal satu F dan satu L selesai di tanggal yang sama.</div>`);

      h += `<details class="fl" id="fl-${f.code}" ${S.open[f.code]?"open":""} data-openkey="${f.code}"><summary>
        <span class="code">${f.code}</span><span>${f.m} · R${f.r}</span><span class="spacer"></span>

        <h3>Catatan terbang</h3><div class="grid">
        ${LOG_FIELDS.map(([k,l,t])=>`<div><label>${l}</label><input type="${t}" ${t==="number"?'inputmode="decimal" step="any"':""} data-logfield="${f.code}|${k}" value="${esc(lg[k])}"></div>`).join("")}

  analisis(){

      h += `<details class="fl" ${S.open["an"+f.code]?"open":""} data-openkey="an${f.code}"><summary><span class="code">${f.code}</span>
        <span>${f.m} · R${f.r}</span><span class="spacer"></span><span class="tag ${d===steps.length?"st-selesai":""}">${d}/${steps.length}</span></summary><div class="body">` +
        steps.map((s,i)=> itemHtml(`an:${f.code}:${i}`, esc(s.t)) +
          (s.cmd ? `<pre class="cmd">${esc(s.cmd)}</pre><button class="btn ghost small" data-copy="${esc(s.cmd)}">Salin perintah</button>` : "")).join("") +
        `</div></details>`;
    });

  skripsi(){ return GROUPS.skripsi.map(g=>groupHtml(g)).join(""); },
  bimbingan(){
    const [d,t] = progress().bimbingan;

      <div class="muted">Catat tiap bimbingan. Poin masukan bisa dijadikan tugas di tab lain (centangnya tersambung)

      <div class="grid" style="margin-top:8px">
        <div><label>Tanggal</label><input type="date" id="bimDate" value="${today()}"></div>
        <div><label>Dengan</label><select id="bimDosen">${DOSEN.map(x=>`<option>${x}</option>`).join("")}</select></div>

      `<option value="${tb}|${g}">${tabTitle(tb)} · ${groupOf(tb,g).title}</option>`).join("");
    [...liveBim()].reverse().forEach(b => {

        <span class="code">${esc(fmtTgl(b.tanggal))}</span><span class="muted">${esc(b.dosen)}${b.topik ? " · "+esc(b.topik) : ""}</span>

          <div class="full"><label>Catatan (baris diawali "-" bisa diubah jadi poin)</label>
            <textarea data-bimfield="${b.id}|catatan" rows="5">${esc(b.catatan)}</textarea></div>
          <div class="full"><button class="btn ghost small" data-parsepoin="${b.id}">Ubah baris "-" jadi poin masukan</button></div>

        </div>
        <h3>Poin masukan</h3>
        ${b.poin.length ? "" : `<div class="muted">Belum ada poin.</div>`}

  sidang(){ return GROUPS.sidang.map(g=>groupHtml(g)).join(""); },

function render(){
  updateHeader();
  const y = window.scrollY;
  $main.innerHTML = VIEWS[S.tab]();
  window.scrollTo(0, y);
}

/* ================= EVENTS ================= */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tab],[data-add],[data-delcustom],[data-act],[data-delday],[data-goflight],[data-copy],[data-gotab],[data-gobim],[data-addpoin],[data-delpoin],[data-parsepoin],[data-delbim],[data-issue],[data-issueurl],[data-calnav],[data-calday],[data-delag],[data-deljad]");
  if (!b) return;
  const d = b.dataset;
  if (d.tab){ S.tab = d.tab; save(); render(); window.scrollTo(0,0); }
  else if (d.add){ addCustom(d.add); }
  else if (d.delcustom){
    const [g,id] = d.delcustom.split("|");
    if (!confirm("Hapus item ini?")) return;
    S.custom[g] = (S.custom[g]||[]).filter(c=>c.id!==id); touch("cu",g); save(); render();
  }
  else if (d.delday){
    if (!confirm("Hapus hari terbang ini beserta checklist-nya?")) return;
    const day = S.days.find(x=>x.id===d.delday);
    if (day){ day.deleted = true; touch("d", day.id); }   // ditandai, bukan dihapus, supaya ikut tersinkron
    save(); render();
  }
  else if (d.goflight){ S.tab="terbang"; S.open[d.goflight]=true; save(); render();
    document.getElementById("fl-"+d.goflight)?.scrollIntoView({behavior:"smooth"}); }
  else if (d.copy){ const old = b.textContent; navigator.clipboard?.writeText(d.copy).then(()=>{ b.textContent="Tersalin ✓"; setTimeout(()=>b.textContent=old,1500); }); }
  else if (d.gotab){ e.preventDefault(); S.tab = d.gotab; save(); render(); window.scrollTo(0,0); }
  else if (d.gobim){ e.preventDefault(); S.tab = "bimbingan"; S.open["b"+d.gobim] = true; save(); render();
    document.getElementById("bim-"+d.gobim)?.scrollIntoView({behavior:"smooth"}); }
  else if (d.addpoin){ addPoin(d.addpoin); }
  else if (d.delpoin){ const [bid,pid] = d.delpoin.split("|"); const bm = bimOf(bid);
    if (!confirm("Hapus poin ini? (Tugas/issue yang sudah dibuat tidak ikut terhapus.)")) return;
    bm.poin = bm.poin.filter(x=>x.id!==pid); touch("b", bid); save(); render(); }
  else if (d.parsepoin){ const bm = bimOf(d.parsepoin); let n = 0;
    (bm.catatan||"").split("\n").forEach(line => { const m = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.+)$/);
      if (m && !bm.poin.some(x=>x.text===m[1].trim())){ bm.poin.push({id:uid(), text:m[1].trim()}); n++; } });
    if (!n){ alert('Tidak ada baris baru yang diawali "-", "*", "•" atau nomor.'); return; }
    touch("b", bm.id); save(); render(); }
  else if (d.delbim){ if (!confirm("Hapus catatan bimbingan ini? Tugas yang sudah dibuat tetap ada.")) return;
    const bm = bimOf(d.delbim); bm.deleted = true; touch("b", bm.id); save(); render(); }
  else if (d.issue){ const [bid,pid] = d.issue.split("|"); createIssue(bimOf(bid), pid, b); }
  else if (d.issueurl){ const [bid,pid] = d.issueurl.split("|"); const bm = bimOf(bid), x = bm.poin.find(y=>y.id===pid);
    const url = (prompt("Tempel link issue GitHub (…/issues/123):") || "").trim();
    const m = url.match(/github\.com\/([^/]+\/[^/]+)\/issues\/(\d+)/);
    if (!m){ if (url) alert("Link issue tidak dikenali."); return; }
    x.issue = {number:+m[2], url:`https://github.com/${m[1]}/issues/${m[2]}`}; delete x.issueForm; touch("b", bid); save(); render(); }
  else if (d.calnav !== undefined){ const n = +d.calnav; let [y,m] = (S.calMonth || today().slice(0,7)).split("-").map(Number);
    if (n===0){ S.calMonth = today().slice(0,7); S.calSel = today(); } else { m += n; if (m<1){ m=12; y--; } if (m>12){ m=1; y++; } S.calMonth = `${y}-${String(m).padStart(2,"0")}`; }
    save(); render(); }
  else if (d.calday){ S.calSel = d.calday; save(); render(); }
  else if (d.deljad){ const j = jadOf(d.deljad); if (!confirm(`Hapus jadwal "${j.title}"?`)) return;
    j.deleted = true; touch("j", j.id); save(); render(); }
  else if (d.delag){ if (!confirm("Hapus agenda ini?")) return;
    const a = (S.agenda||[]).find(x=>x.id===d.delag); if (a){ a.deleted = true; touch("ag", a.id); } save(); render(); }
  else if (d.act) ACTIONS[d.act]();
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (d.check){ S.checks[d.check] = t.checked; touch("c", d.check);
    t.closest(".item")?.classList.toggle("done", t.checked); save(); }
  else if (d.jdone){ const j = jadOf(d.jdone); j.done = t.checked; touch("j", j.id); save(); render(); }
  else if (d.totask && t.value){
    const [bid,pid] = d.totask.split("|"), [tab,gid] = t.value.split("|");
    const bm = bimOf(bid), x = bm.poin.find(y=>y.id===pid);
    const c = {id:uid(), text:x.text, src:bid};
    (S.custom[gid] ||= []).push(c); touch("cu", gid);
    const own = `bim:${bid}:${pid}`;
    if (S.checks[own]){ S.checks[`${gid}:c:${c.id}`] = true; touch("c", `${gid}:c:${c.id}`); }
    x.target = {tab, gid, cid:c.id}; touch("b", bid); save(); render();
  }
  else if (d.bimfield && e.target.tagName !== "TEXTAREA" && e.target.type !== "text"){
    const [id,k] = d.bimfield.split("|"); bimOf(id)[k] = t.value; touch("b", id); save(); render(); }
  else if (d.status){ flOf(d.status).status = t.value; touch("fs", d.status); save(); render(); }
  else if (d.sidang !== undefined){ S.sidang = t.value; touch("sidang"); save(); render(); }
});
document.addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if (d.logfield){ const [c,k] = d.logfield.split("|"); logOf(c)[k] = t.value; touch("fl", c, k); save(); }
  else if (d.projectdir !== undefined){ S.projectDir = t.value.trim() || DEFAULT_DIR; touch("projectDir"); save(); }
  else if (d.bimfield && (t.tagName === "TEXTAREA" || t.type === "text")){
    const [id,k] = d.bimfield.split("|"); bimOf(id)[k] = t.value; touch("b", id); save(); }
  else if (d.dayfield){ const [id,k] = d.dayfield.split("|"); const day = S.days.find(x=>x.id===id); if (day){ day[k]=t.value; touch("d", id); save(); } }
});
// Re-render setelah field angin / tanggal selesai diisi (untuk peringatan)
document.addEventListener("focusout", e => {
  const d = e.target.dataset;
  if (pendingRender){ pendingRender = false; setTimeout(safeRender, 0); return; }
  if ((d.logfield && /\|(angin|tanggal)$/.test(d.logfield)) || (d.dayfield && /\|angin$/.test(d.dayfield))) render();
});
document.addEventListener("keydown", e => {
  if (e.key!=="Enter") return;
  if (e.target.dataset.addinput) addCustom(e.target.dataset.addinput);
  else if (e.target.dataset.poininput) addPoin(e.target.dataset.poininput);
});
function addPoin(bid){
  const inp = document.querySelector(`[data-poininput="${CSS.escape(bid)}"]`);
  const text = inp.value.trim(); if (!text) return;
  bimOf(bid).poin.push({id:uid(), text}); touch("b", bid); save(); render();
  document.querySelector(`[data-poininput="${CSS.escape(bid)}"]`)?.focus();
}
function issueText(b, x){
  return {title: x.text.length > 90 ? x.text.slice(0,87) + "…" : x.text,
    body: `Masukan bimbingan ${fmtTgl(b.tanggal)} (${b.dosen})${b.topik ? " — " + b.topik : ""}:\n\n> ${x.text}\n\n` +
      (b.catatan ? `<details><summary>Catatan bimbingan</summary>\n\n${b.catatan}\n</details>\n\n` : "") +
      `_Dibuat dari aplikasi Checklist Skripsi Edrones._`};
}
function issueFormUrl(b, x){
  const t = issueText(b, x);
  return `${REPO_URL}/issues/new?title=${encodeURIComponent(t.title)}&body=${encodeURIComponent(t.body)}`;
}
async function createIssue(b, pid, btn){
  const x = b.poin.find(y=>y.id===pid);
  if (Sync.on()){
    btn.disabled = true; btn.textContent = "Membuat issue…";
    try {
      const r = await Sync.api(`/repos/${FC_REPO}/issues`, {method:"POST", body: JSON.stringify(issueText(b, x))});
      x.issue = {number:r.number, url:r.html_url}; delete x.issueForm; touch("b", b.id); save(); render(); return;
    } catch(err){
      alert("Issue tidak bisa dibuat otomatis (" + err.message + ").\nToken perlu izin public_repo. " +
        "Sementara pakai tombol \"Buka form issue\" lalu \"Tempel link issue\".");
    }
  }
  x.issueForm = true; save(); render();
}
// Issue yang sudah ditutup di GitHub → poin masukan otomatis dicentang.
async function refreshIssues(){
  let changed = false;
  for (const b of liveBim()) for (const x of b.poin){
    const id = poinCheckId(b, x);
    if (!x.issue?.number || S.checks[id]) continue;
    try { const r = await Sync.api(`/repos/${FC_REPO}/issues/${x.issue.number}`);
      if (r.state === "closed"){ S.checks[id] = true; touch("c", id); changed = true; } } catch(e){}
  }
  if (changed){ save(); safeRender(); }
}
document.addEventListener("toggle", e => {
  const k = e.target.dataset?.openkey; if (!k) return;
  if (e.target.open) S.open[k]=true; else delete S.open[k];
  localStorage.setItem(KEY, JSON.stringify(S));
}, true);

function addCustom(g){
  const inp = document.querySelector(`[data-addinput="${CSS.escape(g)}"]`);
  const text = inp.value.trim(); if (!text) return;
  (S.custom[g] ||= []).push({id:uid(), text}); touch("cu", g); save(); render();
}

function download(name, text, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
const today = () => new Date().toISOString().slice(0,10);
const ACTIONS = {
  export(){ download(`checklist-skripsi-${today()}.json`, JSON.stringify(S,null,2), "application/json"); },
  csv(){
    const cols = ["kode","metode","fuzzy","pid","radius","status",...LOG_FIELDS.map(x=>x[0]),"catatan"];
    const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
    const rows = FLIGHTS.map(f => { const fl = flOf(f.code);
      return [f.code,f.m,f.fz,f.pid,f.r,STATUS[fl.status],...LOG_FIELDS.map(x=>fl.log[x[0]]),fl.log.catatan].map(q).join(","); });
    download(`catatan-terbang-${today()}.csv`, "﻿" + [cols.join(","), ...rows].join("\n"), "text/csv");
  },
  import(){
    const i = document.createElement("input"); i.type="file"; i.accept=".json,application/json";
    i.onchange = () => { const r = new FileReader();
      r.onload = () => { try { const data = JSON.parse(r.result);
          if (typeof data!=="object" || !data.checks) throw new Error("bukan file cadangan");
          if (!confirm("Ganti semua data di HP ini dengan isi file?")) return;
          const keep = {tab:S.tab, open:S.open};
          S = Object.assign(fresh(), data, keep); S.ts = {}; stampAll(S, Date.now()); save(); render();
        } catch(err){ alert("Gagal impor: " + err.message); } };
      r.readAsText(i.files[0]); };
    i.click();
  },
  reset(){
    if (!confirm("Hapus SEMUA centang dan catatan di perangkat ini? Ekspor cadangan dulu kalau ragu." +
      (Sync.on() ? "\n\nData di server tidak dihapus dan akan terambil lagi saat sinkron berikutnya." : ""))) return;
    if (!confirm("Yakin? Tidak bisa dibatalkan.")) return;
    S = fresh(); save(); render();
  },
  addbim(){
    const bm = {id:uid(), tanggal:document.getElementById("bimDate").value || today(),
      dosen:document.getElementById("bimDosen").value, topik:document.getElementById("bimTopik").value.trim(),
      catatan:"", next:"", poin:[]};
    (S.bimbingan ||= []).push(bm); S.bimbingan.sort((x,y)=>x.tanggal.localeCompare(y.tanggal));
    S.open["b"+bm.id] = true; touch("b", bm.id); save(); render();
    document.getElementById("bim-"+bm.id)?.scrollIntoView({behavior:"smooth"});
  },
  addag(){
    const title = document.getElementById("agTitle").value.trim(); if (!title) return;
    const j = {id:uid(), date:S.calSel || today(), title, type:document.getElementById("agType").value, done:false};
    (S.jadwal ||= []).push(j); touch("j", j.id); save(); render();
  },
  importics(){
    const i = document.createElement("input"); i.type = "file"; i.accept = ".ics,text/calendar";
    i.onchange = () => { const r = new FileReader();
      r.onload = () => {
        const evs = parseIcs(String(r.result));
        if (!evs.length){ alert("Tidak ada acara yang terbaca di file ini."); return; }
        let baru = 0, ubah = 0;
        evs.forEach(e => { const old = jadOf(e.id);
          if (old){ Object.assign(old, {date:e.date, type:e.type, title:e.title, deleted:false}); ubah++; }
          else { (S.jadwal ||= []).push(e); baru++; }
          touch("j", e.id); });
        save(); render(); alert(`Impor selesai: ${baru} jadwal baru, ${ubah} diperbarui.`);
      };
      r.readAsText(i.files[0]); };
    i.click();
  },
  ics(){
    const pad = n => String(n).padStart(2,"0");
    const nextDay = d => { const t = new Date(d+"T00:00:00"); t.setDate(t.getDate()+1); return `${t.getFullYear()}${pad(t.getMonth()+1)}${pad(t.getDate())}`; };
    const e2 = t => String(t).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,");
    const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
    const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Checklist Skripsi Edrones//ID","CALSCALE:GREGORIAN"];
    allEvents().forEach((e,i)=>{ lines.push("BEGIN:VEVENT", `UID:edrones-${e.date}-${i}@checklist-skripsi`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${e.date.replace(/-/g,"")}`, `DTEND;VALUE=DATE:${nextDay(e.date)}`,
      `SUMMARY:${e2((EV_TYPES[e.type]||"")+": "+e.title)}`, "END:VEVENT"); });
    lines.push("END:VCALENDAR");
    download(`jadwal-skripsi-${today()}.ics`, lines.join("\r\n"), "text/calendar");
  },
  async update(){
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) await reg.update().catch(()=>{});
    location.reload();
  },
  async syncon(){
    const token = document.getElementById("syncToken").value.trim();
    const gist = document.getElementById("syncGist").value.trim().replace(/^.*\//, "");
    if (!token){ alert("Tempel token GitHub dulu."); return; }
    await Sync.connect(token, gist); render();
  },
  async syncnow(){ await Sync.now(); render(); },
  syncoff(){
    if (!confirm("Putuskan sinkron di perangkat ini? Data di perangkat dan di gist tetap ada.")) return;
    Sync.disconnect(); render();
  },
  addday(){
    const date = document.getElementById("newDay").value || today();
    const day = {id:uid(), date, angin:"", lokasi:"", catatan:""};
    S.days.push(day); touch("d", day.id);
    S.days.sort((a,b)=>a.date.localeCompare(b.date));
    S.open["d"+day.id] = true;
    save(); render();
  },
};

/* ================= SINKRON GITHUB GIST ================= */
// Token dan ID gist disimpan terpisah dari data (tidak ikut file ekspor, tidak ikut ke gist).
const SYNC_KEY = "edrones-sync-v1";
const GIST_FILE = "checklist-skripsi.json";
const Sync = (() => {
  let cfg = {}; try { cfg = JSON.parse(localStorage.getItem(SYNC_KEY) || "{}"); } catch(e){}
  let timer = null, busy = false, again = false;
  let status = cfg.token ? "Belum sinkron" : "Belum diatur";
  const saveCfg = () => localStorage.setItem(SYNC_KEY, JSON.stringify(cfg));
  const badge = () => !cfg.token ? "" : status.startsWith("Tersinkron") ? "☁️ tersinkron" :
    /^(Gagal|Offline)/.test(status) ? "☁️ belum sinkron" : "☁️ menyinkron…";
  function setStatus(t){
    status = t;
    const el = document.getElementById("syncStatus"); if (el) el.textContent = t;
    updateHeader();
  }
  async function api(path, opt = {}){
    const r = await fetch("https://api.github.com" + path, {...opt, headers:{
      "Accept":"application/vnd.github+json", "Authorization":"Bearer " + cfg.token,
      "X-GitHub-Api-Version":"2022-11-28", ...(opt.body ? {"Content-Type":"application/json"} : {})}});
    if (!r.ok) throw new Error(r.status===401 ? "token salah atau kedaluwarsa" :
      r.status===404 ? "gist tidak ditemukan (cek Gist ID dan izin token)" : "HTTP " + r.status);
    return r.json();
  }
  async function readRemote(){
    const g = await api("/gists/" + cfg.gistId);
    if (g.owner?.login && cfg.owner !== g.owner.login){ cfg.owner = g.owner.login; saveCfg(); }
    const ics = g.files[ICS_FILE];
    remoteIcs = ics ? (ics.truncated ? await (await fetch(ics.raw_url)).text() : ics.content) : null;
    const f = g.files[GIST_FILE];
    if (!f) throw new Error(`file ${GIST_FILE} tidak ada di gist ini`);
    const txt = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
    return JSON.parse(txt).data;
  }
  let remoteIcs = null;
  const files = () => ({[GIST_FILE]: {content: JSON.stringify(
    {app:"checklist-skripsi-edrones", disimpan:new Date().toISOString(), data:syncable(S)})},
    [ICS_FILE]: {content: buildIcs()}});
  async function run(){
    if (!cfg.token) return;
    if (busy){ again = true; return; }
    if (!navigator.onLine){ setStatus("Offline: tersimpan di perangkat, sinkron otomatis saat ada internet"); return; }
    busy = true; setStatus("Menyinkron…");
    try {
      if (!cfg.gistId){
        const g = await api("/gists", {method:"POST", body: JSON.stringify(
          {description:"Data Checklist Skripsi Edrones (jangan dihapus)", public:false, files: files()})});
        cfg.gistId = g.id; cfg.owner = g.owner?.login; saveCfg();
      } else {
        const remote = await readRemote();
        const rts = remote.ts || {};
        let needPush = Object.entries(S.ts).some(([k,t]) => t > (rts[k] || 0));
        if (mergeInto(S, remote)){ localStorage.setItem(KEY, JSON.stringify(S)); safeRender(); }
        if (remoteIcs !== buildIcs()) needPush = true;   // feed kalender belum ada / belum sama
        if (needPush) await api("/gists/" + cfg.gistId, {method:"PATCH", body: JSON.stringify({files: files()})});
      }
      cfg.last = Date.now(); saveCfg();
      refreshIssues();
      setStatus("Tersinkron " + new Date(cfg.last).toLocaleString("id-ID", {dateStyle:"medium", timeStyle:"short"}));
    } catch(e){
      setStatus("Gagal sinkron: " + e.message);
    } finally {
      busy = false;
      if (again){ again = false; run(); }
    }
  }
  return {
    api, on: () => !!cfg.token,
    icsUrl: () => cfg.owner && cfg.gistId ? `https://gist.githubusercontent.com/${cfg.owner}/${cfg.gistId}/raw/${ICS_FILE}` : "", gistId: () => cfg.gistId || "", status: () => status, badge,
    schedule(){ if (!cfg.token) return; clearTimeout(timer); timer = setTimeout(run, 2500);
      if (!busy) setStatus("Ada perubahan, menunggu sinkron…"); },
    now: run,
    connect(token, gistId){ cfg = {token, gistId}; saveCfg(); return run(); },
    disconnect(){ clearTimeout(timer); cfg = {}; saveCfg(); setStatus("Belum diatur"); },
  };
})();
window.addEventListener("online", () => Sync.now());
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") Sync.now(); });

// Jangan render ulang saat sedang mengetik (fokus bisa hilang); tunggu sampai field ditinggalkan.
let pendingRender = false;
function safeRender(){
  const a = document.activeElement;
  if (a && a.matches("input[type=text],input[type=number],input[type=password],textarea")){ pendingRender = true; return; }
  render();
}

render();
Sync.now();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  // updateViaCache "none": sw.js selalu dicek ke server, tidak lewat cache HTTP.
  navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(reg => {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(()=>{}); });
  }).catch(()=>{});
  // Begitu versi baru aktif, muat ulang sekali supaya langsung terpakai.
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloaded) return; reloaded = true;
    const a = document.activeElement;
    if (a && a.matches("input,textarea,select")) return;   // jangan ganggu yang sedang mengetik
    location.reload();
  });
}
